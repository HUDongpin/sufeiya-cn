name: Phase 0A release assurance

on:
  push:
    branches: [main, "codex/sufeiya-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase0a-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event_name == 'pull_request' && 'Verify PR merge result' || 'Verify pushed head SHA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Check out exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: binding
        name: Assert exact event SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"

          case "$GITHUB_EVENT_NAME" in
            push)
              evidence_kind="pushed-head"
              ;;
            pull_request)
              evidence_kind="pr-merge-result"
              test -n "$PR_HEAD_SHA"
              test -n "$PR_BASE_SHA"
              mapfile -t parents < <(
                git cat-file -p HEAD |
                  sed -n '/^$/q; s/^parent //p'
              )
              test "${#parents[@]}" -eq 2
              printf '%s\n' "${parents[@]}" | grep -Fxq "$PR_HEAD_SHA"
              printf '%s\n' "${parents[@]}" | grep -Fxq "$PR_BASE_SHA"
              ;;
            *)
              echo "Unexpected event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          echo "tested_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "evidence_kind=$evidence_kind" >> "$GITHUB_OUTPUT"
          {
            echo "### Exact-SHA binding"
            echo
            echo "- Evidence kind: $evidence_kind"
            echo "- Tested SHA: $actual_sha"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "- PR head SHA: $PR_HEAD_SHA"
              echo "- PR base SHA: $PR_BASE_SHA"
            fi
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Git-custodied generated artifacts without writes
        run: npm run check:generated

      - name: Materialize ignored legacy runtimes
        run: npm run generate:next-content

      - name: Verify materialized legacy runtimes
        run: npm run check:legacy-runtime

      - name: Verify legacy contracts
        run: npm run check:legacy

      - name: Run Phase 0A and existing contract tests
        run: >-
          npm run test:foundation &&
          npm run test:clerk &&
          npm run test:offline-navigation &&
          npm run test:public-reading &&
          npm run test:governance &&
          npm run test:workspace-backup &&
          npm run test:teaching-review &&
          npm run test:super-teacher

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build exact event SHA
        run: npm run build

      - name: Verify generation and tracked cleanliness after build
        shell: bash
        run: |
          set -euo pipefail
          npm run check:generated
          npm run check:legacy-runtime
          git diff --exit-code
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" >&2
            exit 1
          fi

      - name: Install Playwright browser matrix
        run: npx playwright install --with-deps chrome chromium firefox webkit

      - name: Public Reading P0 E2E
        run: ./node_modules/.bin/playwright test --config=playwright.public-reading.config.ts

      - name: Offline navigation E2E
        run: ./node_modules/.bin/playwright test --config=playwright.offline.config.ts

      - name: Public accessibility, reflow, privacy, and laboratory performance
        run: ./node_modules/.bin/playwright test --config=playwright.public-quality.config.ts

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase0a-browser-evidence-${{ steps.binding.outputs.tested_sha }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7
