<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#102c29" />
    <link rel="icon" href="/assets/sufeiya-mark.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css" />
    <title>页面没有找到｜苏肥鸭多邻国</title>
    <style>
      .not-found {
        min-height: 100svh;
        padding: 32px;
        display: grid;
        place-items: center;
        background: #fff6dc;
        color: #102c29;
        text-align: center;
      }
      .not-found-inner { width: min(100%, 720px); }
      .not-found img { width: 245px; height: auto; margin: 0 auto 64px; }
      .not-found .code { margin: 0 0 18px; color: #8a5a00; font: 700 11px/1.3 var(--font-mono); letter-spacing: .18em; }
      .not-found h1 { margin: 0; font: 600 clamp(44px, 8vw, 76px)/1.18 var(--font-display); letter-spacing: -.055em; }
      .not-found p { max-width: 530px; margin: 28px auto 0; color: #62726d; font-size: 15px; }
      .not-found .button { margin-top: 38px; width: auto; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="not-found-inner">
        <img src="/assets/sufeiya-logo.png" width="2792" height="560" alt="苏肥鸭多邻国" />
        <p class="code">ERROR / 404</p>
        <h1>这一页暂时没有学习任务。</h1>
        <p>链接可能已经移动。回到首页，我们一起找到真正值得做的下一步。</p>
        <a class="button button-ink" href="/">返回首页</a>
      </div>
    </main>
  </body>
</html>
